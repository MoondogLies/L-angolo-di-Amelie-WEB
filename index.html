<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>L'Angolo di Amelie</title>
<style>
:root{--bianco:#fff;--rosso-scuro:#8e0b20;--font-titoli:"Helvetica", "Helvetica Neue", Arial, sans-serif}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bianco)}
.intro-overlay{position:fixed;inset:0;background:var(--bianco);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;padding:20px;overflow:auto}
.intro-logo{height:clamp(120px, 18vw, 220px);width:auto;max-width:100%;object-fit:contain;animation:comparsaLogo 1s ease both}
.intro-text{margin:0;color:var(--rosso-scuro);font-family:var(--font-titoli);font-size:clamp(20px, 4vw, 34px);font-weight:800;letter-spacing:2px;text-transform:uppercase;text-align:center;animation:comparsaTesto 1s .2s ease both}
@keyframes comparsaLogo{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes comparsaTesto{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){.intro-logo,.intro-text{animation:none}}
</style>
</head>
<body>
<main class="intro-overlay" id="introOverlay">
  <img class="intro-logo" src="silhouette_capelli.png" alt="L’Angolo di Amelie">
  <h1 class="intro-text">L’Angolo di Amelie</h1>
</main>
</body>
</html>
