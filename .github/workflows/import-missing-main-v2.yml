name: Import missing main assets into V2

on:
  push:
    branches: [V2]
    paths:
      - .github/workflows/import-missing-main-v2.yml

permissions:
  contents: write

concurrency:
  group: import-missing-main-assets-v2
  cancel-in-progress: false

jobs:
  copy-assets:
    if: github.repository == 'MoondogLies/L-angolo-di-Amelie-WEB' && github.ref == 'refs/heads/V2'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V2
        uses: actions/checkout@v4
        with:
          ref: V2
          fetch-depth: 0

      - name: Copy only missing files and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          source_commit=$(git rev-parse FETCH_HEAD)
          while read -r expected_blob path; do
            actual_blob=$(git rev-parse "${source_commit}:${path}")
            if [[ "$actual_blob" != "$expected_blob" ]]; then
              echo "Source file changed; refusing to copy: $path" >&2
              exit 1
            fi
            if git cat-file -e "HEAD:${path}" 2>/dev/null; then
              echo "Already present; preserving V2 file: $path"
              continue
            fi
            git restore --source="$source_commit" --staged --worktree -- "$path"
            copied_blob=$(git rev-parse ":${path}")
            if [[ "$copied_blob" != "$expected_blob" ]]; then
              echo "Hash mismatch for copied file: $path" >&2
              exit 1
            fi
          done <<'FILES'
          ed7d86a1a7d7d7e0c7d0a604fe3c23c05aed6141 Comune-Monterotondo.png
          56c0728404fb931188c726e40b71ff5c23d2f988 GoetheInstitut.png
          47fe46e67666404c9bcf29e3ccc0ee68cddd9b4f citta-metropolitana-di-roma-capitale.svg
          023afa7698ba522ba0dc6d8418a460bdf404a32c icm.jpeg
          2842188547bccaec6cf6ca045d6b265f6f5fe259 escapenet.mp4
          fd4d39510c6e9a726aafc45964a7adce6e047de4 tuttiparlanodeltempo.mp4
          FILES
          git rm --ignore-unmatch .github/workflows/import-missing-main-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Copy missing main assets into V2'
          git push origin HEAD:V2
