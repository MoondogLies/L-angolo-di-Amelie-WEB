<head>
<meta charset="utf-8">

<title>Calendario — L'Angolo di Amelie</title>
<style>
:root{--rosso:#c8102e;--rosso-scuro:#8e0b20;--testo:#262626;--grigio:#666}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--testo);background:#fff}
header{background:var(--rosso);color:#fff;padding:16px 20px;position:sticky;top:0;z-index:10;box-shadow:0 3px 12px rgba(0,0,0,.18)}
.header-inner{max-width:1100px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:14px}
h1{margin:0;font-size:clamp(19px,2.5vw,26px)}
.back{color:#fff;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);padding:9px 13px;border-radius:9px;font-weight:700;text-decoration:none}
main{max-width:1100px;margin:auto;padding:30px 18px 70px}
.calendar{border:1px solid #eee;border-radius:18px;overflow:hidden;box-shadow:0 12px 30px rgba(0,0,0,.1)}
.cal-head{display:flex;align-items:center;justify-content:space-between;background:var(--rosso);color:#fff;padding:14px 18px;font-weight:800}
.cal-head button{background:rgba(255,255,255,.2);border:0;color:#fff;width:38px;height:38px;border-radius:50%;font-size:18px;cursor:pointer}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);background:#fafafa}
.day-name{padding:10px 6px;text-align:center;font-size:.78rem;font-weight:800;color:var(--rosso-scuro);background:#fff;border-bottom:1px solid #eee}
.day{
  min-height:88px;padding:8px;border:1px solid #f0f0f0;background:#fff;
  display:flex;flex-direction:column;gap:6px;cursor:pointer;transition:.15s;
}
.day:hover{background:#fff3f4}
.day.empty{background:#fafafa;cursor:default}
.day.today{outline:2px solid var(--rosso);outline-offset:-2px}
.day.selected{background:var(--rosso);color:#fff}
.day.selected .event-pill{background:#fff;color:var(--rosso)}
.day-num{font-weight:800;font-size:.9rem}
.event-pill{
  background:var(--rosso);color:#fff;border-radius:999px;padding:4px 7px;
  font-size:.68rem;font-weight:700;line-height:1.15;
}
.event-detail{
  margin-top:22px;border:1px solid #eee;border-radius:18px;padding:24px;
  box-shadow:0 10px 28px rgba(0,0,0,.08);display:none;
}
.event-detail.show{display:block}
.event-detail .date{display:inline-block;background:var(--rosso);color:#fff;padding:7px 13px;border-radius:999px;font-weight:800;font-size:.85rem}
.event-detail h2{margin:14px 0 8px;color:var(--rosso-scuro)}
.event-detail p{margin:0 0 8px;color:var(--grigio);line-height:1.55}
.no-event{color:var(--grigio)}
footer{background:var(--rosso-scuro);color:#fff;text-align:center;padding:24px;font-size:.9rem}
</style>

<body>

<header>
  <div class="header-inner">
    <h1>Calendario completo</h1>
    <a class="back" href="index.html">← Torna agli eventi</a>
  </div>
</header>

<main>
  <div class="calendar">
    <div class="cal-head">
      <button onclick="cambiaMese(-1)" aria-label="Mese precedente">‹</button>
      <span id="meseCorrente"></span>
      <button onclick="cambiaMese(1)" aria-label="Mese successivo">›</button>
    </div>
    <div class="cal-grid" id="calendario"></div>
  </div>

  <section class="event-detail" id="dettaglio"></section>
</main>

<footer>© <span id="year"></span> L’Angolo di Amelie — Associazione culturale</footer>

<script>
const eventi = [
  {titolo:"Recital di poesia e musica", data:"2026-03-14", ora:"18:30", luogo:"Sede dell’associazione, Roma", descrizione:"Incontro con poeti e musicisti per una serata dedicata alla parola e alla musica dal vivo."},
  {titolo:"Laboratorio di fotografia urbana", data:"2026-04-11", ora:"17:00", luogo:"Centro culturale, Roma", descrizione:"Percorso pratico di fotografia per raccontare la città con luce, composizione e sguardo personale."},
  {titolo:"Cinema e discussione", data:"2026-05-09", ora:"19:00", luogo:"Sala proiezioni, Roma", descrizione:"Proiezione e conversazione aperta su cinema, memoria e rappresentazione del presente."},
  {titolo:"Serata di poesia e musica dal vivo", data:"2026-11-15", ora:"18:30", luogo:"Sede dell’associazione, Roma", descrizione:"Il prossimo appuntamento culturale dell’associazione: letture, musica dal vivo e incontro con il pubblico."},
  {titolo:"Laboratorio di fotografia urbana", data:"2026-11-29", ora:"17:00", luogo:"Centro culturale, Roma", descrizione:"Un percorso pratico per raccontare la città attraverso luce, composizione e sguardo personale."},
  {titolo:"Cinema e immagini del presente", data:"2026-12-13", ora:"19:00", luogo:"Sala proiezioni, Roma", descrizione:"Proiezione seguita da una discussione aperta su cinema, memoria e rappresentazione sociale."},
  {titolo:"Incontro sulla cultura contemporanea", data:"2027-01-10", ora:"18:00", luogo:"Sede dell’associazione, Roma", descrizione:"Una conversazione pubblica su arte, comunità e nuove forme di partecipazione culturale."}
];

const mesi = ["Gennaio","Febbraio","Marzo","Aprile","Maggio","Giugno","Luglio","Agosto","Settembre","Ottobre","Novembre","Dicembre"];
const giorni = ["Lun","Mar","Mer","Gio","Ven","Sab","Dom"];
let vista = new Date();
vista.setDate(1);
let selezionato = null;

function iso(d){
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}

function eventiPerData(isoDate){
  return eventi.filter(e => e.data === isoDate);
}

function disegna(){
  document.getElementById('meseCorrente').textContent = mesi[vista.getMonth()] + " " + vista.getFullYear();
  const grid = document.getElementById('calendario');
  grid.innerHTML = giorni.map(g=>`<div class="day-name">${g}</div>`).join('');

  const primo = new Date(vista.getFullYear(), vista.getMonth(), 1);
  const giorniNelMese = new Date(vista.getFullYear(), vista.getMonth()+1, 0).getDate();
  let offset = (primo.getDay() + 6) % 7;

  for(let i=0;i<offset;i++){
    grid.insertAdjacentHTML('beforeend','<div class="day empty"></div>');
  }

  const oggiIso = iso(new Date());

  for(let g=1; g<=giorniNelMese; g++){
    const data = new Date(vista.getFullYear(), vista.getMonth(), g);
    const dataIso = iso(data);
    const evs = eventiPerData(dataIso);
    const classi = ['day'];
    if(dataIso === oggiIso) classi.push('today');
    if(selezionato === dataIso) classi.push('selected');

    const pills = evs.map(e=>`<span class="event-pill">${e.ora} — ${e.titolo}</span>`).join('');
    grid.insertAdjacentHTML('beforeend',`
      <div class="${classi.join(' ')}" onclick="apriEvento('${dataIso}')">
        <span class="day-num">${g}</span>
        ${pills}
      </div>
    `);
  }
}

function cambiaMese(step){
  vista = new Date(vista.getFullYear(), vista.getMonth()+step, 1);
  disegna();
}

function apriEvento(dataIso){
  selezionato = dataIso;
  disegna();
  const evs = eventiPerData(dataIso);
  const box = document.getElementById('dettaglio');
  box.classList.add('show');

  if(evs.length === 0){
    box.innerHTML = `<span class="date">${formatta(dataIso)}</span><h2>Nessun evento</h2><p class="no-event">Non risultano eventi in calendario per questa data.</p>`;
    return;
  }

  box.innerHTML = evs.map(e=>`
    <span class="date">${formatta(dataIso)} · ore ${e.ora}</span>
    <h2>${e.titolo}</h2>
    <p>${e.descrizione}</p>
    <p><strong>${e.luogo}</strong></p>
  `).join('<hr style="border:0;border-top:1px solid #eee;margin:18px 0">');

  box.scrollIntoView({behavior:'smooth', block:'nearest'});
}

function formatta(dataIso){
  const d = new Date(dataIso + "T00:00:00");
  return `${d.getDate()} ${mesi[d.getMonth()].toLowerCase()} ${d.getFullYear()}`;
}

document.getElementById('year').textContent = new Date().getFullYear();
disegna();
</script>
