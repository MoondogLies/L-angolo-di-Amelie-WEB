<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>L'Angolo di Amelie — Tutti gli eventi</title>
<link rel="icon" type="image/png" href="L-angolo-di-Amelie_favicon.png">
<link rel="apple-touch-icon" href="L-angolo-di-Amelie_favicon.png">
<link rel="stylesheet" href="comune.css?v=20261123d">
<style>
main{
  width:100%;
  max-width:1200px;
  margin:0 auto;
  padding:calc(clamp(160px, 12vw, 200px) + 28px) 18px 70px;
  flex:1;
}
.page-title{
  text-align:center;
  margin-bottom:30px;
}
.page-title h1{
  color:var(--rosso);
  margin:0 0 10px;
  font-size:clamp(26px,5vw,40px);
}
.page-title p{
  margin:0;
  color:var(--grigio);
}


.filtri{
  text-align:center;
  margin:30px 0;
}

.filtro-btn{
  background:var(--rosso);
  color:#fff;
  border:0;
  padding:12px 24px;
  border-radius:999px;
  font-weight:800;
  letter-spacing:.5px;
  text-transform:uppercase;
  cursor:pointer;
  box-shadow:0 10px 26px rgba(0,0,0,.18);
  transition:.2s;
}

.filtro-btn:hover{
  background:var(--rosso-scuro);
  transform:translateY(-2px);
}


.eventi-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:24px;
}
.evento-card{
  position:relative;
  background:#fff;
  border:1px solid #eee;
  border-radius:18px;
  overflow:hidden;
  box-shadow:var(--ombra);
  display:flex;
  flex-direction:column;
}
.evento-poster{
  position:relative;
  aspect-ratio:16 / 9;
  background:#000;
  overflow:hidden;
}
.evento-poster img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}
.card-slideshow{
  position:absolute;
  inset:0;
  overflow:hidden;
}
.card-slideshow img{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  opacity:0;
  transition:opacity .8s ease;
}
.card-slideshow img.attivo{
  opacity:1;
}
.evento-poster::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(to top, rgba(0,0,0,.85) 0%, rgba(0,0,0,.35) 40%, rgba(0,0,0,0) 70%);
  z-index:2;
}
.card-supporto,.card-logo-alto{
  position:absolute;
  z-index:5;
  display:flex;
  align-items:center;
  gap:6px;
  max-width:45%;
}
.card-supporto{right:10px;bottom:10px;}
.card-logo-alto{left:10px;top:10px;}
.card-logo-alto img{max-height:44px;max-width:120px;object-fit:contain;display:block;}
.card-supporto img{
  max-height:44px;
  max-width:120px;
  object-fit:contain;
  display:block;
}
.evento-info{
  padding:18px;
  display:grid;
  gap:10px;
  justify-items:start;
}
.evento-data{
  width:max-content;
  background:var(--rosso);
  color:#fff;
  padding:6px 12px;
  border-radius:999px;
  font-size:.75rem;
  font-weight:800;
  letter-spacing:.3px;
}
.evento-ospiti{
  width:fit-content;
  max-width:100%;
  background:var(--ambra);
  color:#fff;
  padding:6px 12px;
  border-radius:999px;
  font-size:.75rem;
  font-weight:800;
  letter-spacing:.3px;
  line-height:1.3;
  white-space:normal;
  overflow-wrap:anywhere;
  word-break:break-word;
  text-align:left;
}
.evento-ospiti.multi{
  border-radius:12px;
  line-height:1.25;
}
.evento-card h3{
  margin:0;
  color:var(--rosso-scuro);
  font-size:1.3rem;
  line-height:1.2;
}
.evento-card .sottotitolo{
  margin:0;
  color:var(--grigio);
  font-size:.9rem;
  font-weight:700;
}
.evento-card .descrizione{
  margin:0;
  color:#444;
  font-size:.95rem;
  line-height:1.55;
}
.past{
  filter:grayscale(1);
  opacity:.8;
}

.evento-card .card-altri-loghi{
  position:absolute;
  left:18px;
  right:18px;
  bottom:18px;
  margin-top:0;
}

.evento-card:has(.card-altri-loghi) .evento-info{
  padding-bottom:80px;
}

.evento-card .card-altri-loghi .card-altri-loghi-fila{
  display:flex;
  flex-wrap:nowrap;
  align-items:center;
  justify-content:flex-end;
  gap:8px;
  width:100%;
  min-width:0;
  direction:ltr;
}

.evento-card .card-altri-loghi .card-altri-loghi-fila img{
  flex:1 1 0;
  min-width:0;
  width:auto;
  height:44px;
  max-width:120px;
  object-fit:contain;
}




@media(max-width:760px){
  main{padding-top:calc(clamp(160px, 12vw, 200px) + 22px);}
}
@media(max-width:600px){
  .evento-info{
    padding:14px;
  }
  .evento-card h3{
    font-size:1.1rem;
  }
}
</style>
<script data-goatcounter="https://moondoglies.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="logo">
      <div class="logo-bg" id="logoBg" role="img" aria-label="L’Angolo di Amelie"></div>
    </div>
  </div>
  <a class="header-btn" href="index.html" aria-label="Torna alla home" title="Torna alla home"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"/></svg></a>
</header>
<main>
  <div class="filtri">
    <button id="btnPassati" class="filtro-btn" type="button" aria-expanded="false" aria-controls="eventiGrid">Mostra eventi passati</button>
  </div>
  <section class="eventi-grid" id="eventiGrid" aria-label="Eventi"></section>
  <div class="filtri" id="contenitoreAltriFuturi">
    <button id="btnAltriFuturi" class="filtro-btn" type="button">Mostra altri</button>
  </div>
  <div class="filtri" id="contenitoreAltriPassati" style="display:none">
    <button id="btnAltriPassati" class="filtro-btn" type="button">Mostra altri eventi passati</button>
  </div>
</main>
<footer></footer>
<script src="eventi.js?v=20261123d"></script>
<script src="comune.js?v=20261123d"></script>
<script>
const oggi=oggiMezzanotte();
const eventiOrdinati=[...eventi].sort(ordinaPerData);
const eventiFuturi=eventiOrdinati.filter(e=>dataLocale(e.data)>=oggi);
const eventiPassati=eventiOrdinati.filter(e=>dataLocale(e.data)<oggi).reverse();

const grid=document.getElementById('eventiGrid');
const btnPassati=document.getElementById('btnPassati');
const contenitoreAltriFuturi=document.getElementById('contenitoreAltriFuturi');
const contenitoreAltriPassati=document.getElementById('contenitoreAltriPassati');

let futuriVisibili=3;
let passatiVisibili=0;
const passo=3;

function creaCard(e){
  const past=dataLocale(e.data)<oggi;
  const titolo=escapeHtml(e.titolo);
  const sottotitolo=e.tipo==="film"
    ? `di ${e.regia} · ${e.paese}`
    : (e.tipo==="concorso" ? (e.sottotitolo || "Concorso di cortometraggi") : `Con ${e.artista}`);
  const nomiOspiti=e.ospiti ? e.ospiti.split(",").map(nome=>nome.trim()).filter(Boolean) : [];
  const etichettaOspiti=nomiOspiti.length===1 ? "Ospite" : "Ospiti";
  const ospiti=nomiOspiti.length ? `<span class="evento-ospiti">${etichettaOspiti}: ${escapeHtml(nomiOspiti.join(", "))}</span>` : "";
  const supporto=e.supporto ? `<div class="card-supporto"><img src="${escapeHtml(e.supporto)}" alt="Logo del sostenitore dell’evento"></div>` : "";
  const logoAlto=e.logoAlto ? `<div class="card-logo-alto"><img src="${escapeHtml(e.logoAlto)}" alt="Logo della rassegna"></div>` : "";
  const usaSlideshow=Array.isArray(e.immagini)&&e.immagini.length>1;
  const media=usaSlideshow
    ? `<div class="card-slideshow">${e.immagini.map((immagine,indice)=>`<img class="${indice===0?'attivo':''}" src="${escapeHtml(immagine)}" alt="${titolo}">`).join('')}</div>`
    : `<img src="${escapeHtml(e.immagine)}" alt="${titolo}">`;

  const card=document.createElement('article');
  card.className='evento-card'+(past?' past':'');
  card.innerHTML=`
    <div class="evento-poster">
      ${media}
      ${logoAlto}
      ${supporto}
    </div>
    <div class="evento-info">
      <span class="evento-data">${formattaData(e.data,escapeHtml(e.ora))}</span>
      ${ospiti}
      <h3>${titolo}</h3>
      <p class="sottotitolo">${escapeHtml(sottotitolo)}</p>
      <p class="descrizione">${escapeHtml(e.descrizione || "La descrizione dell’evento sarà presto disponibile.")}</p>
    </div>
  `;
  aggiungiAltriLoghi(card.querySelector('.evento-info'),e);
  return card;
}

function renderGrid(){
  const eventiVisibili=[
    ...eventiFuturi.slice(0,futuriVisibili),
    ...eventiPassati.slice(0,passatiVisibili)
  ].sort(ordinaPerData);
  grid.innerHTML='';
  eventiVisibili.forEach(e=>grid.appendChild(creaCard(e)));
  avviaSlideshow();
  aggiornaBadgeOspiti();
  contenitoreAltriFuturi.style.display=futuriVisibili<eventiFuturi.length ? 'block' : 'none';
  contenitoreAltriPassati.style.display=passatiVisibili>0 && passatiVisibili<eventiPassati.length ? 'block' : 'none';
}

// Fa andare a capo la riga degli ospiti quando è troppo lunga
function aggiornaBadgeOspiti(){
  document.querySelectorAll('.evento-ospiti').forEach(badge=>{
    badge.classList.toggle('multi',badge.getClientRects().length>1);
  });
}
window.addEventListener('resize',aggiornaBadgeOspiti);

// Slideshow con dissolvenza per le card con più immagini
let slideshowTimers=[];
function avviaSlideshow(){
  slideshowTimers.forEach(timer=>clearInterval(timer));
  slideshowTimers=[];
  document.querySelectorAll('.card-slideshow').forEach(slideshow=>{
    const immagini=[...slideshow.querySelectorAll('img')];
    if(immagini.length<2) return;
    let indiceAttivo=0;
    slideshowTimers.push(setInterval(()=>{
      immagini[indiceAttivo].classList.remove('attivo');
      indiceAttivo=(indiceAttivo+1)%immagini.length;
      immagini[indiceAttivo].classList.add('attivo');
    },4000));
  });
}

btnPassati.addEventListener('click',()=>{
  const mostra=passatiVisibili===0;
  passatiVisibili=mostra ? passo : 0;
  btnPassati.textContent=mostra ? 'Nascondi eventi passati' : 'Mostra eventi passati';
  btnPassati.setAttribute('aria-expanded',String(mostra));
  renderGrid();
});
document.getElementById('btnAltriFuturi').addEventListener('click',()=>{
  futuriVisibili=Math.min(futuriVisibili+passo,eventiFuturi.length);
  renderGrid();
});
document.getElementById('btnAltriPassati').addEventListener('click',()=>{
  passatiVisibili=Math.min(passatiVisibili+passo,eventiPassati.length);
  renderGrid();
});

renderGrid();
</script>
</body>
</html>
